<!-- TEMPORARY dev tool: lets the team preview color themes live on real pages.
     Delete this include (and its reference in _layouts/default.html) once a
     theme is finalized. -->
<div class="theme-switcher">
  <label for="theme-select">Preview theme:</label>
  <select id="theme-select">
    <option value="">Community Warm (current default)</option>
    <option value="official-white">Montville Official — White header</option>
    <option value="official-navy">Montville Official — Navy header</option>
    <option value="minima">Minima Default</option>
  </select>
</div>
<script>
  (function () {
    var select = document.getElementById('theme-select');
    var saved = localStorage.getItem('theme-preview') || '';
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
      select.value = saved;
    }
    select.addEventListener('change', function () {
      var value = select.value;
      if (value) {
        document.documentElement.setAttribute('data-theme', value);
      } else {
        document.documentElement.removeAttribute('data-theme');
      }
      localStorage.setItem('theme-preview', value);
    });
  })();
</script>
